name: "Trunk-Based: Deploy to Staging"

on:
  workflow_dispatch:
  schedule:
    # Run daily at 9 AM UTC (optional - remove if not needed)
    - cron: '0 9 * * *'

permissions:
  contents: read

jobs:
  test:
    name: "Run Tests"
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Run tests on remote
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: uv run python run_tests_on_remote.py

  deploy-staging:
    name: "Deploy Databricks Assets to Staging"
    needs: test
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate and deploy bundle
        run: |
          databricks bundle validate -t staging
          databricks bundle deploy -t staging
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
